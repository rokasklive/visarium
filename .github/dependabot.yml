# Weekly, grouped, so a week of bumps is one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
    groups: { images: { patterns: ["*"] } }
    # rust is pinned with rust-toolchain.toml; bump both together by hand.
    ignore:
      - dependency-name: rust
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups: { cargo: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { npm: { update-types: [minor, patch] } }
    # Pinned on purpose: diagram anchors read their output, so bump them by hand
    # with e2e/canvas.objects.spec.ts (web/src/features/canvas/objects/versions.test.ts).
    ignore:
      - dependency-name: mermaid
      - dependency-name: "@plantuml/core"
