name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

# Same steps as `just check`.
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # The desktop crate links WebKitGTK on Linux, so clippy and tests need it.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev libdbus-1-dev

      - name: Install toolchain and dependencies
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          pnpm install --frozen-lockfile

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm check
      - run: pnpm typecheck
      - run: node web/scripts/licenses.mjs --check
      - run: cargo test --workspace --locked
      - run: pnpm test
      - run: pnpm --filter @visarium/web build
      - run: pnpm --filter @visarium/web check:bundle

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ponytail: built from source each run (~2 min); swap for a pinned prebuilt binary if it drags.
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
