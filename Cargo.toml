[workspace]
members = ["server", "desktop"]
resolver = "3"

[profile.release]
lto = "thin"
strip = true

# Password hashing is deliberately slow; unoptimised, it is slow enough to
# make every test that signs in take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
