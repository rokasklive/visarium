# cargo deny check — dependency licenses, advisories and sources.

[graph]
all-features = true

[advisories]
ignore = [
  # Marvin timing attack on RSA *decryption with a private key*. rsa reaches us
  # only through openidconnect, which verifies ID-token signatures with the
  # provider's public key. No fixed rsa release exists yet.
  # Unmaintained, no successor; pulled in by oauth2 and openidconnect.
  { id = "RUSTSEC-2026-0543", reason = "transitive via oauth2/openidconnect, no replacement" },
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only, via openidconnect" },
]
unmaintained = "workspace"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
