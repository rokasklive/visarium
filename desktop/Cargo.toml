[package]
name = "visarium-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
alpha-updater = ["dep:flate2", "dep:libc", "dep:tar", "dep:tempfile", "dep:tauri-plugin-updater"]

[[bin]]
name = "visarium-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = "0.4"
drag = "2.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
keyring = "4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tracing = "0.1"
zip = { version = "9", default-features = false }
visarium-server = { path = "../server" }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
tauri-plugin-updater = { version = "~2.14.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The server's own, to seed a library in tests.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
