[package]
name = "visarium-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
# The loopback rehearsal feed (desktop/scripts/alpha-update.mjs): its own
# keychain, and the updater trusts only the feed's pinned CA.
alpha-updater = []

[[bin]]
name = "visarium-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = "0.4"
drag = "2.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
keyring = "4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "~2.14.1"
tokio = { version = "1", features = ["net", "io-util", "time"] }
tracing = "0.1"
zip = { version = "9", default-features = false }
visarium-server = { path = "../server" }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
libc = "0.2"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The server's own, to seed a library in tests.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
